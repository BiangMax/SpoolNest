name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t spoolnest:test .
      - name: Verify container startup
        run: |
          docker run -d --name spoolnest -e ADMIN_TOKEN=ci-only-not-a-real-secret-32-characters -p 127.0.0.1:4310:4310 spoolnest:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:4310/api/health; then exit 0; fi
            sleep 2
          done
          docker logs spoolnest
          exit 1
