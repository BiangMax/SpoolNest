name: Publish container

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version from package.json (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/biangmax/spoolnest
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare tracked build context
        run: |
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir "$RUNNER_TEMP/release-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-source"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build and test both architectures
        env:
          ADMIN_TOKEN: ci-only-not-a-real-secret-32-characters
        run: |
          trap 'docker rm -f spoolnest-release >/dev/null 2>&1 || true' EXIT
          for arch in amd64 arm64; do
            tag="$IMAGE:$VERSION-$arch"
            docker build --platform "linux/$arch" --tag "$tag" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" "$RUNNER_TEMP/release-source"
            test "$(docker image inspect --format '{{.Architecture}}' "$tag")" = "$arch"
            docker run -d --name spoolnest-release --platform "linux/$arch" \
              --env ADMIN_TOKEN -p 127.0.0.1:4310:4310 "$tag"
            curl --fail --silent --show-error --retry 30 --retry-connrefused \
              --retry-delay 2 http://127.0.0.1:4310/api/health |
              jq -e --arg version "$VERSION" '.status == "ok" and .version == $version'
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:4310/api/overview)" = 401
            curl --fail --silent --show-error --header "Authorization: Bearer $ADMIN_TOKEN" \
              http://127.0.0.1:4310/api/overview |
              jq -e '.spools == [] and .printers == [] and .jobs == [] and .transactions == []'
            docker rm -f spoolnest-release
          done
      - name: Publish verified images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-amd64"
          docker push "$IMAGE:$VERSION-arm64"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" |
            jq -e '[.manifests[].platform | [.os, .architecture]] | sort == [["linux", "amd64"], ["linux", "arm64"]]'
